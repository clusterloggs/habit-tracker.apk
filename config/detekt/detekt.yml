build:
  maxIssues: 0
  excludeDefaultRuleSets: false
  excludeCorrectionRuleSet: false

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: false
  CommentsOverCallbacks:
    active: true
  DeprecatedBlockTag:
    active: true
  DeprecatedClassTag:
    active: true
  EndOfLineComment:
    active: false
  OutdatedDocComment:
    active: true
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

complexity:
  active: true
  CognitiveComplexMethod:
    threshold: 30
  ComplexCondition:
    threshold: 4
  ComplexInterface:
    threshold: 10
  CyclomaticComplexMethod:
    threshold: 15
  LongMethod:
    threshold: 60
  LongParameterList:
    threshold: 6
  MethodOverloading:
    threshold: 6
  NestedBlockDepth:
    threshold: 4
  TooManyFunctions:
    threshold: 11
  TooManySheets:
    active: false

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  active: true

exceptions:
  active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - Error
      - Exception
      - IllegalMonitorStateException
      - NullPointerException
      - RuntimeException
      - Throwable
    allowedExceptionNameRegex: "^(_|(ignore|expected).*)"
  TooGenericExceptionThrown:
    exceptionNames:
      - Error
      - Exception
      - Throwable
      - RuntimeException

naming:
  active: true
  BooleanPropertyNaming:
    active: true
  ClassNaming:
    active: true
  ConstructorParameterNaming:
    active: true
  EnumNaming:
    active: true
  FileNaming:
    active: true
  ForbiddenClassName:
    active: false
  FunctionMaxLength:
    maximumFunctionNameLength: 30
  FunctionMinLength:
    minimumFunctionNameLength: 3
  FunctionNaming:
    active: true
  FunctionParameterNaming:
    active: true
  InvalidPackageDeclaration:
    active: true
  MatchingDeclarationName:
    mustEndWithDeclarationName: true
  MemberNameEqualsClassName:
    active: true
  NoNameShadowing:
    active: true
  NonBooleanPropertyPrefixedWithIs:
    active: true
  ObjectPropertyNaming:
    active: true
  PackageNaming:
    active: true
  TopLevelPropertyNaming:
    active: true
  VariableMaxLength:
    maximumVariableNameLength: 64
  VariableMinLength:
    minimumVariableNameLength: 1
  VariableNaming:
    active: true

performance:
  active: true
  ArrayPrimitive:
    active: true
  CouldBeSequence:
    threshold: 2
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
  UnnecessaryPartOfBinaryExpression:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

potential-bugs:
  active: true
  CastToNullableType:
    active: true
  Cloneable:
    active: true
  DontDowncastCollectionTypes:
    active: true
  DoubleMutabilityForCollection:
    active: true
  DuplicateCaseInWhenExpression:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsNullCall:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  HasPlatformType:
    active: true
  IgnoredReturnValue:
    active: true
  ImplicitDefaultLocale:
    active: true
  ImplicitUnitReturnType:
    active: true
  InvalidRange:
    active: true
  IteratorFake:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  LateinitUsage:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: true
  MissingCaseInWhenExpression:
    active: true
  MissingDependencyClass:
    active: true
  MissingPackageDeclaration:
    active: true
  MissingWhileBody:
    active: true
  NullCheckOnMutableProperty:
    active: true
  NullableToStringCall:
    active: true
  NullInsteadOfDefaultValue:
    active: true
  PropertyUsedBeforeDeclaration:
    active: true
  RedundantElseInWhen:
    active: true
  RedundantNotNullCheck:
    active: true
  RedundantSafeCallLet:
    active: true
  ReturnFromFinally:
    active: true
  SafeCastAfterInstanceOf:
    active: true
  SelfReferenceEqualityCheck:
    active: true
  SuspiciousColonOperator:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessaryNotNullSafeOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCode:
    active: true
  UnusedUnaryOperator:
    active: true
  UselessPostfixExpression:
    active: true
  WrongEqualsTypeParameter:
    active: true

style:
  active: true
  AlsoCouldBeApply:
    active: true
  BracesOnIfStatements:
    active: false
  BracesOnWhenStatements:
    active: false
  CanBeNonNullable:
    active: true
  CascadingCallWrapping:
    active: false
  ClassOrderingViolation:
    active: true
  CollapsibleIfStatements:
    active: true
  DataClassContainsFunctions:
    active: true
  DataClassShouldBeImmutable:
    active: true
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 3
  EqualsNullCall:
    active: true
  EqualsOnSignatureLine:
    active: false
  ExplicitCollectionElementAccessMethod:
    active: true
  ExplicitItLambdaParameter:
    active: true
  ExpressionBodySyntax:
    active: false
  FinalNewInstance:
    active: true
  ForbiddenComment:
    active: false
  ForbiddenImport:
    active: false
  ForbiddenVoid:
    active: false
  FunctionOnlyReturningConstant:
    active: true
  LoopWithTooManyJumpStatements:
    maxJumpCount: 5
  MagicNumber:
    active: true
    excludes: [ "**/test/**", "**/tests/**", "**/*Test.kt" ]
    ignoreNumbers: [ "-1", "0", "1", "2", "100", "1000" ]
  MandatoryBracesLoops:
    active: true
  MaxChainedCallsOnSameLine:
    maxChainedCalls: 5
  MaxLineLength:
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
  MayBeConst:
    active: true
  ModifierOrder:
    active: true
  MultilineLambdaItParameter:
    active: false
  MultilineRawStringIndentation:
    active: false
  NestedClassesVisibility:
    active: true
  NewlineAtEndOfFile:
    active: true
  NoTabs:
    active: true
  NullableBooleanCheck:
    active: true
  ObjectLiteralToLambda:
    active: true
  OptionalAbstractKeyword:
    active: true
  OptionalUnit:
    active: true
  OptionalWhenBraces:
    active: false
  PreferToOverPairSyntax:
    active: true
  ProtectedMemberInFinalClass:
    active: true
  RdisambiguatedReturnType:
    active: true
  RedundantExplicitType:
    active: true
  RedundantHigherOrderMapUsage:
    active: true
  RedundantIfInWhenBranch:
    active: true
  RedundantInnerClassModifier:
    active: true
  RedundantSemicolon:
    active: true
  RedundantVisibilityModifierRule:
    active: true
  ReturnCount:
    max: 2
    excludedFunctions: [ "equals" ]
  SafeCastAfterInstanceOf:
    active: true
  SerialVersionUIDInSerializableClass:
    active: true
  SpacingBetweenDeclarations:
    active: true
  StringShouldBeRawString:
    active: false
  ThrowsCount:
    max: 2
  TrailingComma:
    active: false
  TrailingWhitespace:
    active: true
  TrimIndentation:
    active: false
  UnnecessaryAbstractClass:
    active: true
  UnnecessaryAnnotationUseSiteTargetOnType:
    active: true
  UnnecessaryApply:
    active: true
  UnnecessaryBackticks:
    active: true
  UnnecessaryBracesAroundTrailingLambda:
    active: true
  UnnecessaryFilter:
    active: true
  UnnecessaryInheritance:
    active: true
  UnnecessaryInnerClass:
    active: true
  UnnecessaryLet:
    active: true
  UnnecessaryParentheses:
    active: false
  UnnecessaryToBooleanCall:
    active: true
  UnusedImports:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateMember:
    active: true
  UseArrayLiterals:
    active: false
  UseCheckNotNull:
    active: true
  UseCheckOrError:
    active: true
  UseEmptyCounterpart:
    active: true
  UseIfEmptyOrIfBlank:
    active: true
  UseIfInsteadOfWhen:
    active: false
  UseIsEven:
    active: true
  UseLet:
    active: false
  UseOrEmpty:
    active: true
  UseRange:
    active: true
  UseRequire:
    active: true
  UseRequireNotNull:
    active: true
  UseSparseArrays:
    active: true
  UseStdlibAssert:
    active: true
  VarCouldBeVal:
    active: true
  WildcardImport:
    active: true

type-resolution:
  active: true

verify:
  active: true
  DeprecatedBlockTag:
    active: false
  DeprecatedClassTag:
    active: false
  DeprecatedDocComment:
    active: false
  DeprecatedDocTag:
    active: false
